<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>墨帖 · 文房概念稿</title>
<style>
	:root {
		--paper: #F6F1E7;
		--sheet: #FCF9F2;
		--ink: #2B2B2E;
		--ink-soft: #6E6C66;
		--ink-faint: #9C998F;
		--line: #E6DECD;
		--line-soft: #EFE9DB;
		--cinnabar: #B03A2C;
		--cinnabar-deep: #8E2C21;
		--cinnabar-wash: #F7ECE7;
		--radius: 8px;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		margin: 0;
		background: var(--paper);
		background-image: radial-gradient(rgba(80, 70, 50, .05) 1px, transparent 1px);
		background-size: 22px 22px;
		color: var(--ink);
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
		font-size: 14px;
		line-height: 1.6;
		-webkit-font-smoothing: antialiased;
	}

	/* ---------- 顶栏 ---------- */
	.topbar {
		display: flex;
		align-items: center;
		gap: 12px;
		height: 52px;
		padding: 0 20px;
		background: var(--sheet);
		border-bottom: 1px solid var(--line-soft);
	}
	.brand {
		display: flex;
		align-items: center;
		gap: 10px;
		font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
		font-size: 19px;
		font-weight: 600;
		letter-spacing: .06em;
	}
	.seal {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		width: 26px;
		height: 26px;
		border-radius: 5px;
		background: var(--cinnabar);
		color: #FFF7F0;
		font-size: 13px;
		font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
		letter-spacing: 0;
	}
	.topbar .spacer { flex: 1; }
	.version {
		font-size: 12px;
		color: var(--ink-faint);
		letter-spacing: .02em;
	}
	.btn {
		padding: 7px 14px;
		border: 1px solid var(--line);
		border-radius: var(--radius);
		background: var(--sheet);
		color: var(--ink);
		font: inherit;
		font-size: 13px;
		cursor: pointer;
		transition: border-color .15s, background .15s, color .15s;
	}
	.btn:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
	.btn-primary {
		border-color: var(--cinnabar);
		background: var(--cinnabar);
		color: #FFF7F0;
	}
	.btn-primary:hover { background: var(--cinnabar-deep); border-color: var(--cinnabar-deep); color: #FFF7F0; }

	/* ---------- 主体 ---------- */
	.workspace { display: flex; min-height: calc(100vh - 52px); }

	/* 左：设置面板（低对比分隔 + 留白） */
	.panel {
		flex: 0 0 300px;
		width: 300px;
		min-width: 0;
		padding: 22px 24px 32px;
		background: var(--sheet);
		border-right: 1px solid var(--line-soft);
		overflow: auto;
	}
	.group { padding: 18px 0 16px; border-top: 1px solid var(--line-soft); }
	.group:first-child { border-top: 0; padding-top: 4px; }
	.group-title {
		display: flex;
		align-items: center;
		gap: 8px;
		margin: 0 0 12px;
		font-size: 11.5px;
		font-weight: 600;
		letter-spacing: .14em;
		color: var(--ink-soft);
	}
	.group-title::before {
		content: "";
		width: 3px;
		height: 12px;
		border-radius: 2px;
		background: var(--cinnabar);
	}
	.field { margin-bottom: 12px; }
	.field > label {
		display: block;
		margin-bottom: 5px;
		font-size: 12.5px;
		color: var(--ink-soft);
	}
	.input, .textarea, .select {
		width: 100%;
		padding: 8px 10px;
		border: 1px solid var(--line);
		border-radius: var(--radius);
		background: #FFF;
		color: var(--ink);
		font: inherit;
		font-size: 13px;
		transition: border-color .15s, box-shadow .15s;
	}
	.textarea { min-height: 84px; resize: vertical; }
	.input:focus, .textarea:focus, .select:focus {
		outline: none;
		border-color: var(--cinnabar);
		box-shadow: 0 0 0 3px rgba(176, 58, 44, .10);
	}
	.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }

	/* 分段选择（主题 / 字格颜色） */
	.seg { display: flex; gap: 6px; }
	.seg button {
		flex: 1;
		padding: 7px 0;
		border: 1px solid var(--line);
		border-radius: var(--radius);
		background: #FFF;
		color: var(--ink-soft);
		font: inherit;
		font-size: 12.5px;
		cursor: pointer;
		transition: all .15s;
	}
	.seg button.is-active {
		border-color: var(--cinnabar);
		background: var(--cinnabar-wash);
		color: var(--cinnabar);
		font-weight: 600;
	}
	.swatches { display: flex; gap: 10px; }
	.swatches button {
		width: 26px; height: 26px; padding: 0;
		border: 2px solid transparent;
		border-radius: 50%;
		cursor: pointer;
		box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08);
	}
	.swatches button.is-active { border-color: var(--ink); }

	/* 字格选择：缩略图 + 名称 */
	.zg-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
	.zg-item {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 4px;
		min-width: 0;
		padding: 7px 2px 6px;
		border: 1px solid var(--line);
		border-radius: var(--radius);
		background: #FFF;
		font-size: 10.5px;
		color: var(--ink-soft);
		cursor: pointer;
		transition: all .15s;
	}
	.zg-item svg { display: block; width: 30px; height: 30px; }
	.zg-item.is-active {
		border-color: var(--cinnabar);
		background: var(--cinnabar-wash);
		color: var(--cinnabar);
	}

	/* 滑块 */
	.range-row { display: flex; align-items: center; gap: 10px; }
	.range { flex: 1; appearance: none; height: 3px; border-radius: 2px; background: var(--line); }
	.range::-webkit-slider-thumb {
		appearance: none;
		width: 15px; height: 15px;
		border-radius: 50%;
		background: var(--sheet);
		border: 2px solid var(--cinnabar);
		box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
		cursor: pointer;
	}
	.range-val { min-width: 40px; text-align: right; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

	/* 开关 */
	.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); cursor: pointer; }
	.check input { accent-color: var(--cinnabar); width: 15px; height: 15px; }

	/* ---------- 右：预览区 ---------- */
	.preview {
		flex: 1;
		display: flex;
		align-items: flex-start;
		justify-content: center;
		padding: 32px 20px 56px;
		overflow: auto;
	}
	.page {
		position: relative;
		width: 560px;
		max-width: 100%;
		min-height: 780px;
		padding: 48px 56px 60px;
		background: #FFFEF9;
		border-radius: 3px;
		box-shadow:
			0 1px 1px rgba(70, 58, 38, .05),
			0 2px 6px rgba(70, 58, 38, .06),
			0 18px 40px rgba(70, 58, 38, .12),
			0 40px 90px rgba(70, 58, 38, .10);
	}
	.page-title {
		margin: 0 0 26px;
		text-align: center;
		font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
		font-size: 28px;
		font-weight: 600;
		letter-spacing: .18em;
		color: #2B2B2E;
	}
	.grid-row { display: flex; justify-content: center; gap: 4px; }
	.cell {
		position: relative;
		width: 64px;
		height: 64px;
		background-repeat: no-repeat;
		background-position: center;
		background-size: 64px 64px;
	}
	.cell .hz {
		position: absolute;
		inset: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
		font-size: 46px;
		line-height: 1;
		color: rgba(60, 60, 60, .55);
	}
	.page-no {
		position: absolute;
		right: 22px;
		bottom: 18px;
		font-size: 11px;
		color: #B4AE9F;
		letter-spacing: .04em;
	}
</style>
</head>
<body>

<header class="topbar">
	<div class="brand"><span class="seal">帖</span>墨帖</div>
	<span class="version">v2.0.0</span>
	<div class="spacer"></div>
	<button class="btn">导出 PDF</button>
	<button class="btn btn-primary">打印</button>
</header>

<div class="workspace">

	<aside class="panel">

		<section class="group">
			<h2 class="group-title">外观</h2>
			<div class="field">
				<label>主题</label>
				<div class="seg">
					<button>浅色</button>
					<button>深色</button>
					<button class="is-active">跟随系统</button>
				</div>
			</div>
		</section>

		<section class="group">
			<h2 class="group-title">字帖内容</h2>
			<div class="field">
				<label>内容（换行分段，空行分页）</label>
				<textarea class="textarea">永&#10;永字八法&#10;丶横竖钩&#10;挑撇捺折</textarea>
			</div>
			<div class="field">
				<label>标题（可选）</label>
				<input class="input" value="基本笔画练习">
			</div>
		</section>

		<section class="group">
			<h2 class="group-title">字格</h2>
			<div class="field">
				<label>样式</label>
				<div class="zg-grid">
					<button class="zg-item"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M0 40 L80 40 M40 0 L40 80" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>田字格</button>
					<button class="zg-item"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M0 40 L80 40 M40 0 L40 80 M0 0 L80 80 M0 80 L80 0" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>米字格</button>
					<button class="zg-item is-active"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M0 40 L80 40 M40 0 L40 80 M0 0 L80 80 M0 80 L80 0" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/><path d="M20 10 L60 10 L60 70 L20 70 Z" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>米字回字</button>
					<button class="zg-item"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M20 10 L60 10 L60 70 L20 70 Z" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>回字格</button>
					<button class="zg-item"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M1 10 L79 10 M1 20 L79 20 M1 26 L79 26" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/><path d="M0 53 L80 53 M40 26 L40 80" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>拼音格</button>
					<button class="zg-item"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M1 20 L79 20 M1 40 L79 40 M1 60 L79 60" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>作文格</button>
					<button class="zg-item"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M1 40 L79 40" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>数字格</button>
				</div>
			</div>
			<div class="field">
				<label>颜色</label>
				<div class="swatches">
					<button style="background:#2E7D46" class="is-active"></button>
					<button style="background:#3A3A3E"></button>
					<button style="background:#A33327"></button>
				</div>
			</div>
			<div class="field">
				<label>格子大小</label>
				<div class="range-row"><input type="range" class="range" value="80"><span class="range-val">80px</span></div>
			</div>
		</section>

		<section class="group">
			<h2 class="group-title">文字</h2>
			<div class="field">
				<label>颜色深浅</label>
				<div class="range-row"><input type="range" class="range" value="62"><span class="range-val">62%</span></div>
			</div>
			<label class="check"><input type="checkbox" checked>显示拼音</label>
			<label class="check"><input type="checkbox" checked>笔顺动画（点击字格）</label>
		</section>

		<section class="group">
			<h2 class="group-title">输出</h2>
			<div class="seg">
				<button class="is-active">A4</button>
				<button>B5</button>
				<button>16 开</button>
			</div>
		</section>

	</aside>

	<main class="preview">
		<div class="page">
			<h1 class="page-title">基本笔画练习</h1>
			<div class="grid-row">
				<div class="cell" style="background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><path d='M1 1 L79 1 L79 79 L1 79 Z' fill='none' stroke='%232B2B2E' stroke-width='2'/><path d='M0 40 L80 40 M40 0 L40 80 M0 0 L80 80 M0 80 L80 0' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/><path d='M20 10 L60 10 L60 70 L20 70 Z' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/></svg>&quot;)"><span class="hz">永</span></div>
				<div class="cell" style="background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><path d='M1 1 L79 1 L79 79 L1 79 Z' fill='none' stroke='%232B2B2E' stroke-width='2'/><path d='M0 40 L80 40 M40 0 L40 80 M0 0 L80 80 M0 80 L80 0' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/><path d='M20 10 L60 10 L60 70 L20 70 Z' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/></svg>&quot;)"><span class="hz">字</span></div>
				<div class="cell" style="background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><path d='M1 1 L79 1 L79 79 L1 79 Z' fill='none' stroke='%232B2B2E' stroke-width='2'/><path d='M0 40 L80 40 M40 0 L40 80 M0 0 L80 80 M0 80 L80 0' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/><path d='M20 10 L60 10 L60 70 L20 70 Z' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/></svg>&quot;)"><span class="hz">八</span></div>
				<div class="cell" style="background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><path d='M1 1 L79 1 L79 79 L1 79 Z' fill='none' stroke='%232B2B2E' stroke-width='2'/><path d='M0 40 L80 40 M40 0 L40 80 M0 0 L80 80 M0 80 L80 0' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/><path d='M20 10 L60 10 L60 70 L20 70 Z' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/></svg>&quot;)"><span class="hz">法</span></div>
			</div>
			<div class="grid-row" style="margin-top:10px">
				<div class="cell" style="background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><path d='M1 1 L79 1 L79 79 L1 79 Z' fill='none' stroke='%232B2B2E' stroke-width='2'/><path d='M0 40 L80 40 M40 0 L40 80 M0 0 L80 80 M0 80 L80 0' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/><path d='M20 10 L60 10 L60 70 L20 70 Z' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/></svg>&quot;)"><span class="hz">丶</span></div>
				<div class="cell" style="background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><path d='M1 1 L79 1 L79 79 L1 79 Z' fill='none' stroke='%232B2B2E' stroke-width='2'/><path d='M0 40 L80 40 M40 0 L40 80 M0 0 L80 80 M0 80 L80 0' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/><path d='M20 10 L60 10 L60 70 L20 70 Z' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/></svg>&quot;)"><span class="hz">横</span></div>
				<div class="cell" style="background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><path d='M1 1 L79 1 L79 79 L1 79 Z' fill='none' stroke='%232B2B2E' stroke-width='2'/><path d='M0 40 L80 40 M40 0 L40 80 M0 0 L80 80 M0 80 L80 0' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/><path d='M20 10 L60 10 L60 70 L20 70 Z' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/></svg>&quot;)"><span class="hz">竖</span></div>
				<div class="cell" style="background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><path d='M1 1 L79 1 L79 79 L1 79 Z' fill='none' stroke='%232B2B2E' stroke-width='2'/><path d='M0 40 L80 40 M40 0 L40 80 M0 0 L80 80 M0 80 L80 0' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/><path d='M20 10 L60 10 L60 70 L20 70 Z' fill='none' stroke='%238A8578' stroke-width='1' stroke-dasharray='4 4'/></svg>&quot;)"><span class="hz">钩</span></div>
			</div>
			<div class="page-no">第 1 / 1 页 · 4 个汉字</div>
		</div>
	</main>

</div>

</body>
</html>
