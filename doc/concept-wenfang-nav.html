<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>墨帖 · 文房概念稿（图标分类）</title>
<style>
	:root {
		--paper: #F6F1E7;
		--sheet: #FCF9F2;
		--ink: #2B2B2E;
		--ink-soft: #6E6C66;
		--ink-faint: #9C998F;
		--line: #E6DECD;
		--line-soft: #EFE9DB;
		--cinnabar: #B03A2C;
		--cinnabar-deep: #8E2C21;
		--cinnabar-wash: #F7ECE7;
		--radius: 8px;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		margin: 0;
		background: var(--paper);
		background-image: radial-gradient(rgba(80, 70, 50, .05) 1px, transparent 1px);
		background-size: 22px 22px;
		color: var(--ink);
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
		font-size: 14px;
		line-height: 1.6;
		-webkit-font-smoothing: antialiased;
	}

	/* ---------- 顶栏 ---------- */
	.topbar {
		display: flex;
		align-items: center;
		gap: 12px;
		height: 52px;
		padding: 0 16px;
		background: var(--sheet);
		border-bottom: 1px solid var(--line-soft);
	}
	.brand { display: flex; align-items: center; gap: 10px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 19px; font-weight: 600; letter-spacing: .06em; }
	.seal {
		display: inline-flex; align-items: center; justify-content: center;
		width: 26px; height: 26px; border-radius: 5px;
		background: var(--cinnabar); color: #FFF7F0;
		font-size: 13px; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
	}
	.version { font-size: 12px; color: var(--ink-faint); }
	.topbar .spacer { flex: 1; }
	.theme-seg { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: #FFF; }
	.theme-seg button {
		padding: 4px 10px; border: 0; border-radius: 6px; background: transparent;
		color: var(--ink-soft); font: inherit; font-size: 12.5px; cursor: pointer;
	}
	.theme-seg button.is-active { background: var(--cinnabar-wash); color: var(--cinnabar); font-weight: 600; }
	.btn { padding: 7px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sheet); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
	.btn:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
	.btn-primary { border-color: var(--cinnabar); background: var(--cinnabar); color: #FFF7F0; }
	.btn-primary:hover { background: var(--cinnabar-deep); border-color: var(--cinnabar-deep); color: #FFF7F0; }

	/* ---------- 主体：图标栏 + 面板 + 预览 ---------- */
	.workspace { display: flex; min-height: calc(100vh - 52px); }

	/* 图标导航栏 */
	.rail {
		flex: 0 0 60px;
		width: 60px;
		padding: 14px 0;
		background: var(--sheet);
		border-right: 1px solid var(--line-soft);
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 6px;
	}
	.rail-item {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 3px;
		width: 52px;
		padding: 8px 0 7px;
		border: 1px solid transparent;
		border-radius: 10px;
		background: transparent;
		color: var(--ink-faint);
		font: inherit;
		font-size: 10.5px;
		cursor: pointer;
		transition: all .15s;
	}
	.rail-item svg { display: block; width: 21px; height: 21px; }
	.rail-item:hover { color: var(--cinnabar); background: var(--cinnabar-wash); }
	.rail-item.is-active { color: var(--cinnabar); background: var(--cinnabar-wash); border-color: #E7CFC6; font-weight: 600; }
	.rail .spacer { flex: 1; }

	/* 设置面板 */
	.panel {
		flex: 0 0 272px;
		width: 272px;
		min-width: 0;
		padding: 18px 20px 28px;
		background: var(--sheet);
		border-right: 1px solid var(--line-soft);
		overflow: auto;
	}
	.panel[data-page] { display: none; }
	.panel.is-current { display: block; }
	.page-head { margin: 0 0 12px; }
	.page-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
	.page-head p { margin: 3px 0 0; font-size: 12px; color: var(--ink-faint); }
	.field { margin-bottom: 12px; }
	.field > label { display: block; margin-bottom: 5px; font-size: 12.5px; color: var(--ink-soft); }
	.input, .textarea, .select {
		width: 100%; padding: 8px 10px;
		border: 1px solid var(--line); border-radius: var(--radius);
		background: #FFF; color: var(--ink); font: inherit; font-size: 13px;
		transition: border-color .15s, box-shadow .15s;
	}
	.textarea { min-height: 108px; resize: vertical; }
	.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--cinnabar); box-shadow: 0 0 0 3px rgba(176, 58, 44, .10); }
	.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
	.seg { display: flex; gap: 6px; }
	.seg button { flex: 1; padding: 7px 0; border: 1px solid var(--line); border-radius: var(--radius); background: #FFF; color: var(--ink-soft); font: inherit; font-size: 12.5px; cursor: pointer; transition: all .15s; }
	.seg button.is-active { border-color: var(--cinnabar); background: var(--cinnabar-wash); color: var(--cinnabar); font-weight: 600; }
	.swatches { display: flex; gap: 10px; }
	.swatches button { width: 26px; height: 26px; padding: 0; border: 2px solid transparent; border-radius: 50%; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
	.swatches button.is-active { border-color: var(--ink); }
	.zg-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
	.zg-item { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; padding: 7px 2px 6px; border: 1px solid var(--line); border-radius: var(--radius); background: #FFF; font-size: 10.5px; color: var(--ink-soft); cursor: pointer; transition: all .15s; }
	.zg-item svg { display: block; width: 28px; height: 28px; }
	.zg-item.is-active { border-color: var(--cinnabar); background: var(--cinnabar-wash); color: var(--cinnabar); }
	.range-row { display: flex; align-items: center; gap: 10px; }
	.range { flex: 1; appearance: none; height: 3px; border-radius: 2px; background: var(--line); }
	.range::-webkit-slider-thumb { appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--cinnabar); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); cursor: pointer; }
	.range-val { min-width: 40px; text-align: right; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
	.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); cursor: pointer; }
	.check input { accent-color: var(--cinnabar); width: 15px; height: 15px; }
	.tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
	.tpl-item { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 4px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: #FFF; font-size: 11.5px; color: var(--ink-soft); cursor: pointer; transition: all .15s; }
	.tpl-item.is-active { border-color: var(--cinnabar); background: var(--cinnabar-wash); color: var(--cinnabar); font-weight: 600; }
	.mini-grid { display: inline-flex; gap: 2px; }
	.mini-grid i { width: 8px; height: 8px; border-radius: 1px; background: var(--line); }
	.mini-grid i.on { background: var(--cinnabar); }
	.mini-grid i.soft { background: #C9C2B2; }
	.mini-grid i.empty { border: 1px dashed var(--line); background: transparent; }
	.tools-row { display: flex; gap: 6px; flex-wrap: wrap; }
	.tools-row button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #FFF; color: var(--ink-soft); font: inherit; font-size: 12px; cursor: pointer; }
	.tools-row button:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
	.note { font-size: 11.5px; color: var(--ink-faint); }

	/* ---------- 预览区 ---------- */
	.preview { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 32px 20px 56px; overflow: auto; }
	.page {
		position: relative; width: 560px; max-width: 100%; min-height: 780px;
		padding: 48px 56px 60px; background: #FFFEF9; border-radius: 3px;
		box-shadow: 0 1px 1px rgba(70, 58, 38, .05), 0 2px 6px rgba(70, 58, 38, .06), 0 18px 40px rgba(70, 58, 38, .12), 0 40px 90px rgba(70, 58, 38, .10);
	}
	.page-title { margin: 0 0 26px; text-align: center; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 28px; font-weight: 600; letter-spacing: .18em; color: #2B2B2E; }
	.grid-row { display: flex; justify-content: center; gap: 4px; margin-top: 10px; }
	.cell { position: relative; width: 64px; height: 64px; background-repeat: no-repeat; background-position: center; background-size: 64px 64px; }
	.cell .hz { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 46px; line-height: 1; color: rgba(60, 60, 60, .55); }
	.page-no { position: absolute; right: 22px; bottom: 18px; font-size: 11px; color: #B4AE9F; letter-spacing: .04em; }
</style>
</head>
<body>

<header class="topbar">
	<div class="brand"><span class="seal">帖</span>墨帖</div>
	<span class="version">v2.0.0</span>
	<div class="spacer"></div>
	<div class="theme-seg">
		<button>浅色</button>
		<button>深色</button>
		<button class="is-active">跟随系统</button>
	</div>
	<button class="btn">导出 PDF</button>
	<button class="btn btn-primary">打印</button>
</header>

<div class="workspace">

	<nav class="rail" id="rail">
		<button class="rail-item is-current" data-page="content">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h7"/></svg>
			内容
		</button>
		<button class="rail-item" data-page="layout">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M3.5 12h17M12 3.5v17"/></svg>
			版式
		</button>
		<button class="rail-item" data-page="grid">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16"/><path d="M4 12h16M12 4v16M4 4l16 16M20 4L4 20"/></svg>
			字格
		</button>
		<button class="rail-item" data-page="text">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l3.5-1 10-10-2.5-2.5-10 10z"/><path d="M14.5 5.5l2-2 2.5 2.5-2 2z"/><path d="M9 19l1.5-3.5"/></svg>
			文字
		</button>
		<button class="rail-item" data-page="output">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V4h10v4"/><rect x="4" y="8" width="16" height="8" rx="1.5"/><path d="M7 13h10v7H7z"/></svg>
			输出
		</button>
		<div class="spacer"></div>
		<button class="rail-item" data-page="about">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".6" fill="currentColor"/></svg>
			关于
		</button>
	</nav>

	<aside class="panel is-current" data-page="content">
		<div class="page-head"><h2>字帖内容</h2><p>换行分段，空行分页</p></div>
		<div class="field">
			<label>内容</label>
			<textarea class="textarea">永&#10;永字八法&#10;丶横竖钩&#10;挑撇捺折</textarea>
		</div>
		<div class="field">
			<label>标题（可选）</label>
			<input class="input" value="基本笔画练习">
		</div>
		<div class="field">
			<label>工具</label>
			<div class="tools-row">
				<button>示例</button><button>清空</button><button>去重</button><button>排序</button>
			</div>
		</div>
		<p class="note">已输入 4 行 · 约 1 页</p>
	</aside>

	<aside class="panel" data-page="layout">
		<div class="page-head"><h2>版式</h2><p>每行 8 格 · A4 · 80px</p></div>
		<div class="field">
			<label>排版模板</label>
			<div class="tpl-grid">
				<button class="tpl-item"><span class="mini-grid"><i class="on"></i><i class="soft"></i><i class="soft"></i><i class="empty"></i></span>整页描红</button>
				<button class="tpl-item is-active"><span class="mini-grid"><i class="on"></i><i class="soft"></i><i class="soft"></i><i class="soft"></i></span>一字三描</button>
				<button class="tpl-item"><span class="mini-grid"><i class="on"></i><i class="soft"></i><i class="soft"></i><i class="empty"></i></span>逐字递减</button>
				<button class="tpl-item"><span class="mini-grid"><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i></span>空白</button>
			</div>
		</div>
		<div class="field">
			<label>描红范字数</label>
			<div class="range-row"><input type="range" class="range" value="3"><span class="range-val">3 格</span></div>
		</div>
		<div class="field">
			<label>每行格数</label>
			<div class="range-row"><input type="range" class="range" value="8" max="8"><span class="range-val">8 格</span></div>
		</div>
		<div class="field">
			<label>行距</label>
			<div class="range-row"><input type="range" class="range" value="12"><span class="range-val">12%</span></div>
		</div>
		<div class="field">
			<label>字距</label>
			<div class="range-row"><input type="range" class="range" value="5"><span class="range-val">5%</span></div>
		</div>
		<div class="field">
			<label>纸张</label>
			<select class="select"><option>A4（210 × 297）</option><option>A5（148 × 210）</option><option>B5（176 × 250）</option><option>16 开（184 × 260）</option><option>Letter（216 × 279）</option></select>
		</div>
		<div class="field">
			<label>页边距（上 / 下 / 左 / 右）</label>
			<div class="seg"><button>5</button><button>5</button><button>16</button><button>16</button></div>
		</div>
	</aside>

	<aside class="panel" data-page="grid">
		<div class="page-head"><h2>字格</h2><p>7 种样式 · 3 种颜色</p></div>
		<div class="field">
			<label>样式</label>
			<div class="zg-grid">
				<button class="zg-item"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M0 40 L80 40 M40 0 L40 80" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>田字格</button>
				<button class="zg-item"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M0 40 L80 40 M40 0 L40 80 M0 0 L80 80 M0 80 L80 0" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>米字格</button>
				<button class="zg-item is-active"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M0 40 L80 40 M40 0 L40 80 M0 0 L80 80 M0 80 L80 0" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/><path d="M20 10 L60 10 L60 70 L20 70 Z" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>米字回字</button>
				<button class="zg-item"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M20 10 L60 10 L60 70 L20 70 Z" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>回字格</button>
				<button class="zg-item"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M1 10 L79 10 M1 20 L79 20 M1 26 L79 26" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/><path d="M0 53 L80 53 M40 26 L40 80" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>拼音格</button>
				<button class="zg-item"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M1 20 L79 20 M1 40 L79 40 M1 60 L79 60" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>作文格</button>
				<button class="zg-item"><svg viewBox="0 0 80 80"><path d="M1 1 L79 1 L79 79 L1 79 Z" fill="none" stroke="#2B2B2E" stroke-width="2"/><path d="M1 40 L79 40" fill="none" stroke="#8A8578" stroke-width="1" stroke-dasharray="4 4"/></svg>数字格</button>
			</div>
		</div>
		<div class="field">
			<label>颜色</label>
			<div class="swatches"><button style="background:#2E7D46" class="is-active"></button><button style="background:#3A3A3E"></button><button style="background:#A33327"></button></div>
		</div>
		<div class="field">
			<label>格子大小</label>
			<div class="range-row"><input type="range" class="range" value="80"><span class="range-val">80px</span></div>
		</div>
	</aside>

	<aside class="panel" data-page="text">
		<div class="page-head"><h2>文字</h2><p>字体 · 颜色 · 辅助</p></div>
		<div class="field">
			<label>字体</label>
			<select class="select"><option>系统楷体（默认）</option><option>自定义字体 URL</option></select>
		</div>
		<div class="field">
			<label>颜色</label>
			<div class="swatches"><button style="background:#B03A2C" class="is-active"></button><button style="background:#2B2B2E"></button><button style="background:#B46A2F"></button></div>
		</div>
		<div class="field">
			<label>深浅</label>
			<div class="range-row"><input type="range" class="range" value="62"><span class="range-val">62%</span></div>
		</div>
		<label class="check"><input type="checkbox" checked>显示拼音</label>
		<label class="check"><input type="checkbox" checked>笔顺动画（点击字格）</label>
	</aside>

	<aside class="panel" data-page="output">
		<div class="page-head"><h2>输出</h2><p>打印 · 导出 · 预设</p></div>
		<div class="tools-row">
			<button>打印</button><button>导出 PDF</button><button>导出 PNG</button>
		</div>
		<div class="field" style="margin-top:14px">
			<label>预设</label>
			<div class="tools-row"><button>保存当前为预设</button><button>重置全部</button></div>
		</div>
		<p class="note">打印时自动使用亮色纸张（深色模式下同样输出白底）</p>
	</aside>

	<aside class="panel" data-page="about">
		<div class="page-head"><h2>关于</h2><p>墨帖 v2.0.0</p></div>
		<p class="note">离线单文件应用，数据保存在本机浏览器。</p>
		<div class="tools-row"><button>检查更新</button><button>清空本地数据</button></div>
	</aside>

	<main class="preview">
		<div class="page">
			<h1 class="page-title">基本笔画练习</h1>
			<div class="grid-row">

<script>
	document.getElementById('rail').addEventListener('click', function (e) {
		var item = e.target.closest('.rail-item');
		if (!item) return;
		var page = item.getAttribute('data-page');
		document.querySelectorAll('.rail-item').forEach(function (b) { b.classList.toggle('is-current', b === item); });
		document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('is-current', p.getAttribute('data-page') === page); });
	});
</script>
